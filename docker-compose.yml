name: vigo

services:
  postgres:
    # Multi-arch (amd64 + arm64) build of postgis/postgis; the official image is amd64-only.
    image: imresamu/postgis:17-3.5
    environment:
      POSTGRES_USER: vigo
      POSTGRES_PASSWORD: vigo
      POSTGRES_DB: vigo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigo -d vigo"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:

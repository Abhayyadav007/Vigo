[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"

# Versions live here; member crates opt in with `dep.workspace = true`.
[workspace.dependencies]
# --- internal crates ---
shared = { path = "crates/shared" }
domain = { path = "crates/domain" }
db = { path = "crates/db" }

# --- async runtime + web ---
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
axum = "0.8.9"
tower-http = { version = "0.7", features = ["trace", "cors"] }

# --- database ---
# NOTE: no PostGIS `geography` mapping in sqlx. Never SELECT the raw
# `location` column - project it with ST_X / ST_Y / ST_Distance (all float8).
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "uuid",
  "chrono",
  "macros",
  "migrate",
] }

# --- serialisation ---
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.0", features = ["serde", "v4"] }
chrono = { version = "0.4.45", features = ["serde"] }

# --- observability + errors + config ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
dotenvy = "0.15"

[profile.dev]
# Rust debug builds are slow to link; this is the cheapest win available.
opt-level = 0
debug = 1

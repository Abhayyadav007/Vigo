[workspace]
resolver = "3"
members = ["apps/backend"]

[workspace.package]
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = [
  "cors",
  "trace",
  "request-id",
  "compression-gzip",
  "compression-br",
  "timeout",
  "util",
  "fs",
  "set-header",
] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio-rustls",
  "postgres",
  "macros",
  "chrono",
  "uuid",
  "migrate",
  "json",
] }
# Code uses the re-export `deadpool_redis::redis`; the direct `redis` dependency
# only enables features on that same crate (Lua `Script` support).
deadpool-redis = { version = "0.23", features = ["rt_tokio_1"] }
redis = { version = "1", default-features = false, features = ["script", "aio", "tokio-comp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2"] }
validator = { version = "0.21", features = ["derive"] }
base64 = "0.22"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
http-body-util = "0.1"
ts-rs = { version = "12", features = ["serde-compat", "uuid-impl", "chrono-impl"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"

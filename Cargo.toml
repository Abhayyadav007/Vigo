[workspace]
resolver = "3"
# `apps/user_backend` and `packages/db` are superseded by `apps/backend`
# and intentionally left out of the workspace.
members = ["apps/backend"]

[workspace.package]
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = [
  "cors",
  "trace",
  "request-id",
  "compression-gzip",
  "compression-br",
  "timeout",
  "util",
] }
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio-rustls",
  "postgres",
  "macros",
  "chrono",
  "uuid",
  "migrate",
] }
# `redis` is used via the re-export `deadpool_redis::redis` to keep versions in lockstep.
deadpool-redis = { version = "0.23", features = ["rt_tokio_1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "http2"] }
validator = { version = "0.21", features = ["derive"] }
base64 = "0.22"
http-body-util = "0.1"
ts-rs = { version = "12", features = ["serde-compat", "uuid-impl", "chrono-impl", "format"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
